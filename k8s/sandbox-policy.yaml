apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-sandbox-egress
  namespace: default
spec:
  podSelector:
    matchExpressions:
    - key: agents.x-k8s.io/sandbox-name-hash
      operator: Exists
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.0.0/16
