apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-agent
  namespace: default
  labels:
    app: data-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-agent
  template:
    metadata:
      labels:
        app: data-agent
    spec:
      serviceAccountName: adk-agent-sa
      containers:
      - name: data-agent
        image: ${IMAGE}
        ports:
        - containerPort: 8080
        env:
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "TRUE"
        - name: GOOGLE_CLOUD_PROJECT
          value: "${PROJECT_ID}"
        - name: GOOGLE_CLOUD_LOCATION
          value: "global"
---
apiVersion: v1
kind: Service
metadata:
  name: data-agent-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: data-agent
  ports:
  - port: 80
    targetPort: 8080
